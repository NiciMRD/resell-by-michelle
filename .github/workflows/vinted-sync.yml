name: Vinted-Artikel aktualisieren

on:
  schedule:
    - cron: "0 5 * * *" # täglich 05:00 UTC (6/7 Uhr deutscher Zeit)
  workflow_dispatch: # Button "Run workflow" für manuellen Abruf

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/vinted_sync.py https://www.vinted.de/member/61501619-mxchellexm
        env:
          TZ: Europe/Berlin # "Zuletzt aktualisiert" in deutscher Zeit
      - name: Commit, falls sich etwas geändert hat
        run: |
          git config user.name "vinted-sync"
          git config user.email "actions@users.noreply.github.com"
          git add vinted-items.json
          git diff --cached --quiet || (git commit -m "Vinted-Artikel aktualisiert" && git push)
